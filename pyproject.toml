[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "chinescan"
version = "0.1.0"
description = "A modular, authorization-first security investigation platform."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "typer>=0.15,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "tomli-w>=1.2,<2",
  "pyyaml>=6.0.2,<7",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6.1,<8",
  "ruff>=0.11,<1",
  "mypy>=1.15,<3",
  "pip-audit>=2.8,<3",
]

[project.scripts]
chinescan = "chinescan.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["chinescan"]

[tool.hatch.build.targets.wheel.force-include]
"chinescan/data/top-packages.txt" = "chinescan/data/top-packages.txt"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "bandit>=1.9,<2",
    "httpx2>=2.16.0",
]
