title = "Chinescan Gitleaks configuration"

[extend]
useDefault = true

# Suppress only exact synthetic fixture values at their specific fixture paths.
[[allowlists]]
description = "Synthetic GitHub-shaped value in the scanner-positive fixture"
condition = "AND"
paths = ['''(^|/)fixtures/real-scanners/gitleaks-positive/credential\.txt$''']
regexTarget = "secret"
regexes = ['''^ghp_0123456789abcdef0123456789abcdef0123$''']

[[allowlists]]
description = "Synthetic weak password in the intentionally unsafe scanner fixture"
condition = "AND"
paths = ['''(^|/)fixtures/sample-python-project/app\.py$''']
regexTarget = "secret"
regexes = ['''^example-fixture-password$''']
