name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # astral-sh/setup-uv v10.3.3
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --locked --python 3.12 --extra dev
      - run: uv run --locked --extra dev ruff check .
      - run: uv run --locked --extra dev ruff format --check .
      - run: uv run --locked --extra dev mypy --strict chinescan
      # Optional real_scanner tests require external binaries and local data and remain opt-in.
      - run: uv run --locked --extra dev pytest --cov=chinescan --cov-report=term-missing --cov-fail-under=80
      - run: uv run --locked --extra dev pip-audit --skip-editable
      - run: uv run --locked --extra dev bandit --severity-level medium -r chinescan

  dashboard:
    name: dashboard build and browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # astral-sh/setup-uv v10.3.3
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --locked --python 3.12 --extra dev

      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.0"
          package-manager-cache: false

      - run: npm ci --no-audit
        working-directory: frontend
      # npm's install-time audit is suppressed above to keep installation separate from review.
      - run: npm audit --audit-level=moderate
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test -- --reporter=dot
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          CHINESCAN_PYTHON: ${{ github.workspace }}/.venv/bin/python

  windows-b1:
    name: Windows managed malware worker acceptance
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # astral-sh/setup-uv v10.3.3
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --locked --python 3.12 --extra dev
      # Keep mocked control-path tests separate from real worker launches. The latter
      # start contained child processes and have independent temp/state lifetimes.
      - run: uv run --locked --extra dev pytest tests/unit/test_managed_malware.py -q -k "not test_actual_windows_contained_worker_returns_bounded_synthetic_result and not test_actual_windows_manager_persists_contained_synthetic_analysis and not test_actual_job_object_terminates_synthetic_child_process_tree" --full-trace
      # Run every real Windows containment check together in a fresh pytest process.
      - run: uv run --locked --extra dev pytest tests/unit/test_managed_malware.py -q -k "test_actual_windows_contained_worker_returns_bounded_synthetic_result or test_actual_windows_manager_persists_contained_synthetic_analysis or test_actual_job_object_terminates_synthetic_child_process_tree" --full-trace

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history is needed to detect credentials removed in later commits.
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      # actions/setup-go v5.5.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.25.0"
          cache: false

      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      # Redact any finding from logs; the scanner receives no write token or secrets.
      - run: "$(go env GOPATH)/bin/gitleaks detect --source . --redact --no-banner"

  container:
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: docker build -f docker/Dockerfile -t chinescan:ci .

      # aquasecurity/trivy-action v0.36.0
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.1
          scan-type: config
          # Scan shipped container definitions. Deliberately insecure Dockerfiles
          # under fixtures/real-scanners are positive scanner test inputs.
          scan-ref: docker
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      # Scan the same local image that the container job just built.
      # aquasecurity/trivy-action v0.36.0
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.1
          scan-type: image
          image-ref: chinescan:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "0"

      # Report all findings above; fail only when a high/critical fix is available.
      # aquasecurity/trivy-action v0.36.0
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.1
          skip-setup-trivy: true
          scan-type: image
          image-ref: chinescan:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
