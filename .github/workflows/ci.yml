name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # astral-sh/setup-uv v6.0.0
      - uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev ruff check .
      - run: uv run --locked --extra dev ruff format --check .
      - run: uv run --locked --extra dev mypy --strict chinescan
      - run: uv run --locked --extra dev pytest --cov=chinescan --cov-report=term-missing --cov-fail-under=80
      - run: uv run --locked --extra dev pip-audit --skip-editable
      - run: uv run --locked --extra dev bandit --severity-level medium -r chinescan

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history is needed to detect credentials removed in later commits.
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      # actions/setup-go v5.5.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.25.0"
          cache: false

      - run: go install github.com/gitleaks/gitleaks/v8@v8.30.1
      # Redact any finding from logs; the scanner receives no write token or secrets.
      - run: "$(go env GOPATH)/bin/gitleaks detect --source . --redact --no-banner"

  container:
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: docker build -f docker/Dockerfile -t chinescan:ci .

      # aquasecurity/trivy-action v0.36.0
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.1
          scan-type: config
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      # Scan the same local image that the container job just built.
      # aquasecurity/trivy-action v0.36.0
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.1
          scan-type: image
          image-ref: chinescan:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "0"

      # Report all findings above; fail only when a high/critical fix is available.
      # aquasecurity/trivy-action v0.36.0
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.1
          skip-setup-trivy: true
          scan-type: image
          image-ref: chinescan:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
