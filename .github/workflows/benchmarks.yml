name: Offline benchmarks

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # astral-sh/setup-uv v6.0.0
      - uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --locked --extra dev
      - run: uv run --locked python scripts/benchmark_local.py --iterations 25 --warmup 3 --output benchmark-results.json

      # actions/upload-artifact v7.0.2; artifact names carry the source revision.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: benchmark-${{ github.sha }}
          path: benchmark-results.json
          if-no-files-found: error
          retention-days: 90
